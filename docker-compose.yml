# Entregavel 2.1 (E2) - Ambiente de desenvolvimento configurado
#
# Montei este ambiente inteiro em Docker pra qualquer pessoa do time (ou eu
# mesmo, em outra maquina) subir exatamente a mesma coisa com um comando
# so, sem precisar instalar PostgreSQL nem bibliotecas Python na mao.
#
#   docker compose up -d --build            -> PostgreSQL + pgvector e container Python
#   docker compose exec app bash            -> entra no container com as dependencias
#   docker compose --profile tools up -d    -> + pgAdmin (http://localhost:5050)
services:

  # PostgreSQL 16 com a extensao pgvector - um banco so pra guardar tanto os
  # dados de negocio (schema dw, entregavel 2.2) quanto o conhecimento do
  # RAG (schema rag, entregavel 2.4), decisao que ja tinha tomado na E1.
  db:
    image: pgvector/pgvector:pg16
    container_name: analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container Python com as dependencias do projeto (LangGraph, FastAPI,
  # pgvector, libs de embedding). O projeto inteiro e montado em /app via
  # volume (ver abaixo), entao alterar um script nao exige rebuild - so
  # muda requirements.txt que precisa de "docker compose up -d --build".
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics_app
    restart: unless-stopped
    # chave da NVIDIA e nomes dos modelos (copie .env.example para .env)
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@db:5432/analytics
    ports:
      - "8000:8000"   # reservado para a API FastAPI
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # pgAdmin (opcional) - so sobe com: docker compose --profile tools up -d.
  # No dia a dia uso o DBeaver direto na porta 5432, entao isso fica mais
  # como uma alternativa de reserva.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: analytics_pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
